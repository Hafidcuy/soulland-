name: Build & Test Soul Land Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod (verifikasi compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload jar hasil build
        uses: actions/upload-artifact@v4
        with:
          name: soulland-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  server-test:
    name: Uji boot server Forge dengan mod terpasang
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jar hasil build
        uses: actions/download-artifact@v4
        with:
          name: soulland-mod-jar
          path: modjar

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Forge 1.20.1 server
        run: |
          mkdir -p server/mods
          cd server
          curl -L -o forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar"
          java -jar forge-installer.jar --installServer
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties

      - name: Pasang mod ke server
        run: cp modjar/*.jar server/mods/

      - name: Boot server (timeout 240 detik)
        run: |
          cd server
          timeout 240 sh run.sh nogui || echo "Server dihentikan oleh timeout (normal untuk uji boot)."

      - name: Verifikasi mod termuat tanpa crash
        run: |
          LOG=server/logs/latest.log
          test -f "$LOG" || { echo "FAIL: log server tidak ditemukan"; exit 1; }
          echo "--- Bukti mod terdaftar ---"
          grep -i "soulland" "$LOG" | head -20 || true
          echo "--- Cek crash fatal ---"
          if grep -qiE "Failed to start|Encountered an unexpected exception|Crash report|ERROR.*soulland|ModLoadingException" "$LOG"; then
            echo "FAIL: terdeteksi error fatal di log server"
            tail -100 "$LOG"
            exit 1
          fi
          if grep -q "Done (" "$LOG"; then
            echo "PASS: Server berhasil menyala penuh (world termuat) dengan mod Soul Land terpasang."
          else
            echo "FAIL: Server tidak mencapai status 'Done' dalam batas waktu boot."
            tail -100 "$LOG"
            exit 1
          fi

  release:
    name: Buat GitHub Release
    needs: [build, server-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download jar hasil build
        uses: actions/download-artifact@v4
        with:
          name: soulland-mod-jar
          path: modjar

      - name: Buat release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Soul Land: Douluo Dalu v1.0.0"
          body: |
            Mod Minecraft Java untuk **Forge 1.20.1** bertema dunia Soul Land (Douluo Dalu).

            ## Fitur
            - Sistem kultivasi 10 peringkat (Spirit Scholar sampai Title Douluo), level 1-99
            - Gacha Martial Soul saat login pertama (10 soul dari series), hanya bisa diubah di Creative
            - Spirit Ring 100 / 1.000 / 10.000 / 100.000 tahun dari soul beast & boss
            - 20 skill martial soul (tombol R dan G), memakai Spirit Power + cooldown
            - Boss diperkuat: Wither 600 HP, Warden 800 HP, Ender Dragon 1000 HP (boss akhir)
            - Buku panduan lengkap otomatis untuk pemain baru
            - Multiplayer-ready (semua logika di server)

            ## Cara pasang
            1. Install Minecraft Forge 1.20.1
            2. Unduh `soulland-1.0.0.jar` di bawah
            3. Taruh di folder `mods` (client dan server)

            Release ini terverifikasi oleh CI: compile bersih + uji boot server Forge dedicated lulus.
          files: modjar/*.jar
