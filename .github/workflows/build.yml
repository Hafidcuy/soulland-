name: Build & Test Soul Land Mod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod (verifikasi compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        run: gradle build --no-daemon --console=plain

      - name: Cek aset piksel ada semua
        run: |
          echo "--- jumlah texture soul ---"
          ls src/main/resources/assets/soulland/textures/soul/*.png | wc -l
          echo "--- jumlah soul di data ---"
          python3 -c "import json;d=json.load(open('src/main/resources/data/soulland/martial_souls.json'));print(len(d['souls']))"
          echo "--- cek texture yang dirujuk model item ---"
          python3 - <<'PY'
          import json, os, glob
          base = "src/main/resources/assets/soulland"
          missing = []
          for path in glob.glob(base + "/models/item/*.json"):
              model = json.load(open(path))
              for name in model.get("textures", {}).values():
                  if not name.startswith("soulland:"):
                      continue
                  tex = base + "/textures/" + name.split(":")[1] + ".png"
                  if not os.path.exists(tex):
                      missing.append(tex)
          if missing:
              print("FAIL: texture hilang:", missing)
              raise SystemExit(1)
          print("PASS: semua texture item ada.")
          PY

      - name: Upload jar hasil build
        uses: actions/upload-artifact@v4
        with:
          name: soulland-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  server-test:
    name: Uji boot server Forge dengan mod terpasang
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jar hasil build
        uses: actions/download-artifact@v4
        with:
          name: soulland-mod-jar
          path: modjar

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Forge 1.20.1 server
        run: |
          mkdir -p server/mods
          cd server
          curl -L -o forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar"
          java -jar forge-installer.jar --installServer
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties

      - name: Pasang mod ke server
        run: cp modjar/*.jar server/mods/

      - name: Boot server (timeout 300 detik)
        run: |
          cd server
          timeout 300 sh run.sh nogui || echo "Server dihentikan oleh timeout (normal untuk uji boot)."

      - name: Verifikasi mod termuat tanpa crash
        run: |
          LOG=server/logs/latest.log
          test -f "$LOG" || { echo "FAIL: log server tidak ditemukan"; exit 1; }
          echo "--- Bukti mod terdaftar ---"
          grep -i "soulland" "$LOG" | head -20 || true
          echo "--- Cek crash fatal ---"
          if grep -qiE "Failed to start|Encountered an unexpected exception|Crash report|ModLoadingException" "$LOG"; then
            echo "FAIL: terdeteksi error fatal di log server"
            tail -100 "$LOG"
            exit 1
          fi
          if grep -q "Done (" "$LOG"; then
            echo "PASS: Server berhasil menyala penuh (world termuat) dengan mod Soul Land terpasang."
          else
            echo "FAIL: Server tidak mencapai status 'Done' dalam batas waktu boot."
            tail -100 "$LOG"
            exit 1
          fi

  release:
    name: Buat GitHub Release
    needs: [build, server-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download jar hasil build
        uses: actions/download-artifact@v4
        with:
          name: soulland-mod-jar
          path: modjar

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: "Soul Land: Douluo Dalu ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}"
          body: |
            Mod Minecraft Java untuk **Forge 1.20.1** bertema dunia Soul Land (Douluo Dalu).

            ## Fitur
            - **1.995 martial soul** dari seluruh Benua Douluo, dibangun dari sumber lore resmi series
              (tabel Moegirlpedia, daftar wiki Soul Land, dan daftar lengkap 武魂大全).
              Termasuk bentuk evolusi, bentuk tahun ring (10.000 dan 100.000 tahun), soul gabungan
              (武魂融合技), body soul setelah awakening kedua, dan bentuk ultimate attribute.
            - **9.975 skill** dengan lima skill per martial soul, terbuka bertahap di spirit ring 1, 2, 3, 5, 7.
            - **Tampilan martial soul**: kartu soul (tekan J) dan companion yang melayang di belakangmu (tekan K).
            - **Efek serangan unik per skill**: tujuh arketipe bentuk (bola, garis, kerucut, cincin, cakram, pilar, badai)
              plus entitas energi khusus untuk teknik ikonik, guncangan kamera, dan kilat layar.
            - **Sistem baru**: meditasi, sekte dengan bonus pasif, evolusi martial soul, soul beast bertingkat,
              ledakan spirit ring, dan kilatan soul pada setiap pukulan biasa.
            - **Aset**: 1.995 potret soul 16x16 digambar dengan kode, plus texture item berlapis.
            - Boss diperkuat: Wither 600 HP, Warden 800 HP, Ender Dragon 1000 HP (boss akhir).

            ## Cara pasang
            1. Install Minecraft Forge 1.20.1
            2. Unduh `soulland-*.jar` di bawah
            3. Taruh di folder `mods` (client dan server)

            Release ini terverifikasi oleh CI: compile bersih + uji boot server Forge dedicated lulus.
          files: modjar/*.jar
